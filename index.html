<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BellApp - Panel del Estudio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .font-serif-luxury { font-family: 'Playfair Display', serif; }
    </style>
</head>
<body class="bg-stone-950 text-stone-100 min-h-screen p-4 md:p-8 flex items-center justify-center">

    <!-- CONTENEDOR DE NOTIFICACIONES TOAST -->
    <div id="toast-container" class="fixed bottom-5 right-5 z-50 pointer-events-none flex flex-col gap-2"></div>

    <!-- PANTALLA DE LOGIN ORIGINAL -->
    <div id="pantalla-login" class="max-w-md w-full bg-stone-900 p-8 rounded-3xl border border-stone-800 shadow-2xl space-y-6">
        <div class="text-center space-y-2">
            <h1 class="font-serif-luxury text-3xl font-bold text-amber-400">BellApp</h1>
            <p class="text-xs text-stone-400 uppercase tracking-widest">Acceso a tu Estudio</p>
        </div>

        <div class="space-y-4">
            <div>
                <label class="text-[11px] text-stone-400 font-semibold uppercase block mb-1">Usuario</label>
                <input type="text" id="login-usuario" placeholder="ej. betsy" class="w-full bg-stone-950 border border-stone-800 p-3 rounded-xl text-xs text-stone-100 focus:outline-none focus:border-amber-500">
            </div>
            <div>
                <label class="text-[11px] text-stone-400 font-semibold uppercase block mb-1">PIN / Contraseña</label>
                <input type="password" id="login-pass" placeholder="••••" class="w-full bg-stone-950 border border-stone-800 p-3 rounded-xl text-xs text-stone-100 focus:outline-none focus:border-amber-500">
            </div>
            <button onclick="iniciarSesion()" class="w-full bg-amber-600 hover:bg-amber-500 text-stone-950 py-3 rounded-xl text-xs font-bold transition shadow-md">Ingresar</button>
        </div>
    </div>

    <!-- APLICACIÓN PRINCIPAL (MANTIENE SU DISEÑO ORIGINAL) -->
    <div id="app-principal" class="max-w-md w-full bg-stone-900 text-stone-100 p-6 rounded-3xl border border-stone-800 shadow-2xl space-y-6 hidden">
        
        <header class="flex justify-between items-center border-b border-stone-800 pb-4">
            <div>
                <h2 id="app-titulo-estudio" class="font-serif-luxury text-xl font-bold text-amber-400">Estudio</h2>
                <p class="text-[10px] text-stone-400 uppercase">Panel de Control</p>
            </div>
            <div class="flex items-center gap-2">
                <button id="btn-admin-maestro" onclick="window.location.href='admin.html'" class="hidden text-[10px] bg-purple-950 text-purple-300 font-bold px-2.5 py-1.5 rounded-lg border border-purple-800">👑 Admin</button>
                <button onclick="cerrarSesion()" class="text-[10px] bg-stone-800 text-stone-300 hover:bg-stone-700 font-bold px-2.5 py-1.5 rounded-lg">Salir</button>
            </div>
        </header>

        <!-- SECCIÓN DE REGISTRAR COBRO (CON EL NUEVO BOTÓN INTEGRADO) -->
        <div class="space-y-4">
            <h3 class="text-xs font-bold text-amber-400 uppercase tracking-wider flex items-center gap-1.5">
                <span>📄</span> Registrar Cobro
            </h3>

            <div>
                <label class="text-[11px] text-stone-400 font-semibold uppercase block mb-1">Buscar Clienta:</label>
                <input type="text" id="input-buscar-clienta" placeholder="Escribe para buscar clienta..." class="w-full bg-stone-950 border border-stone-800 p-2.5 rounded-xl text-xs text-stone-100 focus:outline-none focus:border-amber-500">
            </div>

            <!-- TOCA LOS SERVICIOS REALIZADOS + NUEVO BOTÓN DE GESTIÓN -->
            <div>
                <div class="flex justify-between items-center mb-1.5">
                    <label class="text-[11px] text-stone-400 font-semibold uppercase">Toca los servicios realizados:</label>
                    <button onclick="abrirModalServicios()" class="text-[10px] bg-amber-950/60 hover:bg-amber-900/60 text-amber-300 font-bold px-2 py-1 rounded-lg border border-amber-800/60 transition flex items-center gap-1">
                        ➕ Añade nuevos servicios
                    </button>
                </div>
                <div id="lista-servicios-cobro" class="grid grid-cols-2 gap-2 max-h-48 overflow-y-auto pr-1">
                    <!-- Se cargan dinámicamente de la base de datos -->
                </div>
            </div>

            <!-- TOTAL A COBRAR -->
            <div class="bg-stone-950 p-4 rounded-2xl border border-stone-800 flex justify-between items-center">
                <span class="text-xs font-bold text-stone-400 uppercase">TOTAL A COBRAR:</span>
                <span id="label-total-cobrar" class="font-serif-luxury text-xl font-bold text-amber-400">$0.00</span>
            </div>

            <div>
                <select id="select-metodo-pago" class="w-full bg-stone-950 border border-stone-800 p-2.5 rounded-xl text-xs text-stone-200 focus:outline-none">
                    <option value="Efectivo">💵 Efectivo</option>
                    <option value="Transferencia">📱 Transferencia</option>
                    <option value="Tarjeta">💳 Tarjeta</option>
                </select>
            </div>

            <div>
                <textarea id="input-nota-cobro" placeholder="Nota opcional..." rows="2" class="w-full bg-stone-950 border border-stone-800 p-2.5 rounded-xl text-xs text-stone-100 focus:outline-none"></textarea>
            </div>

            <button onclick="guardarCitaCobro()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-stone-950 py-3 rounded-xl text-xs font-bold transition shadow-md">Guardar y Cerrar Cita</button>
        </div>
    </div>

    <!-- MODAL GESTIÓN DE SERVICIOS (PARA EDITAR, ELIMINAR O AÑADIR) -->
    <div id="modal-servicios" class="fixed inset-0 bg-black/70 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-stone-900 border border-stone-800 rounded-3xl max-w-md w-full p-6 shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto text-stone-100">
            <div class="flex justify-between items-center border-b border-stone-800 pb-3">
                <h3 class="font-bold text-amber-400 text-sm uppercase tracking-wider">🛠️ Gestionar Catálogo de Servicios</h3>
                <button onclick="cerrarModalServicios()" class="text-stone-400 hover:text-stone-200 font-bold text-base">✕</button>
            </div>

            <div class="space-y-2">
                <label class="text-[11px] font-bold text-stone-400 uppercase block">Servicios Actuales</label>
                <div id="container-servicios-editar" class="space-y-2 max-h-48 overflow-y-auto pr-1">
                    <!-- Inputs editables -->
                </div>
            </div>

            <hr class="border-stone-800">

            <div class="space-y-3 bg-stone-950 p-4 rounded-2xl border border-stone-800">
                <label class="text-[11px] font-bold text-amber-400 uppercase block">➕ Añadir Nuevo Servicio</label>
                <div>
                    <input type="text" id="nuevo-nombre-servicio" placeholder="Nombre (ej. Limpieza facial)" class="w-full bg-stone-900 border border-stone-800 p-2.5 rounded-xl text-xs text-stone-100 focus:outline-none focus:border-amber-500">
                </div>
                <div>
                    <input type="number" step="0.01" id="nuevo-precio-servicio" placeholder="Precio ($)" class="w-full bg-stone-900 border border-stone-800 p-2.5 rounded-xl text-xs text-stone-100 focus:outline-none focus:border-amber-500 font-mono">
                </div>
                <button onclick="crearNuevoServicio()" class="w-full bg-amber-600 hover:bg-amber-500 text-stone-950 py-2.5 rounded-xl text-xs font-bold transition">Guardar Nuevo Servicio</button>
            </div>

            <button onclick="cerrarModalServicios()" class="w-full bg-stone-800 hover:bg-stone-700 text-stone-300 py-2.5 rounded-xl text-xs font-bold transition">Cerrar y Actualizar</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://udddoohrdhmekrwstcnu.supabase.co"; 
        const SUPABASE_ANON_KEY = "sb_publishable_qr02Rl-cs9BWfws_pN3fSQ_5MZ5q6F-"; 
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let usuarioActual = null;
        let serviciosEstudio = [];
        let servicioSeleccionado = null;

        function mostrarToast(mensaje, esError = false) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `pointer-events-auto px-4 py-3 rounded-xl text-xs font-bold shadow-2xl transition-all duration-300 transform translate-y-2 opacity-0 ${esError ? 'bg-rose-600 text-white border border-rose-500' : 'bg-emerald-500 text-stone-950 border border-emerald-400'}`;
            toast.innerText = mensaje;
            
            container.appendChild(toast);
            setTimeout(() => toast.classList.remove('translate-y-2', 'opacity-0'), 10);
            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 2000);
        }

        async function iniciarSesion() {
            const user = document.getElementById('login-usuario').value.trim().toLowerCase();
            const pass = document.getElementById('login-pass').value.trim();

            if (!user || !pass) {
                mostrarToast("Completa usuario y contraseña", true);
                return;
            }

            const { data: usuario, error } = await supabaseClient
                .from('usuarios')
                .select('*')
                .ilike('usuario', user)
                .eq('password', pass)
                .single();

            if (error || !usuario) {
                mostrarToast("Usuario o PIN incorrectos", true);
                return;
            }

            if (usuario.estado !== 'activo') {
                mostrarToast("⚠️ Tu cuenta se encuentra suspendida.", true);
                return;
            }

            usuarioActual = usuario;
            sessionStorage.setItem('bellapp_user', JSON.stringify(usuario));
            aplicarConfiguracionEstudio(usuario);
        }

        async function aplicarConfiguracionEstudio(usuario) {
            document.getElementById('pantalla-login').classList.add('hidden');
            document.getElementById('app-principal').classList.remove('hidden');
            document.getElementById('app-titulo-estudio').innerText = usuario.nombre_estudio;

            if (usuario.rol === 'admin') {
                document.getElementById('btn-admin-maestro').classList.remove('hidden');
            }

            await cargarServiciosEstudio();
        }

        async function cargarServiciosEstudio() {
            if (!usuarioActual) return;

            const { data: servicios, error } = await supabaseClient
                .from('servicios')
                .select('*')
                .eq('usuario_id', usuarioActual.id)
                .order('created_at', { ascending: true });

            if (!error) {
                serviciosEstudio = servicios || [];
                renderizarBotonesServiciosCobro();
            }
        }

        function renderizarBotonesServiciosCobro() {
            const container = document.getElementById('lista-servicios-cobro');
            if (!container) return;
            container.innerHTML = '';

            if (serviciosEstudio.length === 0) {
                container.innerHTML = `<p class="text-[11px] text-stone-500 col-span-2 py-3 text-center italic">Sin servicios. Haz clic en "Añade nuevos servicios".</p>`;
                return;
            }

            serviciosEstudio.forEach(s => {
                container.innerHTML += `
                    <button type="button" onclick="seleccionarServicio('${s.id}', '${s.nombre_servicio}', ${s.precio})" class="p-2.5 rounded-xl border border-stone-800 hover:border-amber-500 bg-stone-950 hover:bg-stone-900 text-left transition flex justify-between items-center group">
                        <span class="text-xs text-stone-300 font-medium group-hover:text-amber-300">${s.nombre_servicio}</span>
                        <span class="text-xs font-bold text-amber-400">$${Number(s.precio).toFixed(2)}</span>
                    </button>
                `;
            });
        }

        function seleccionarServicio(id, nombre, precio) {
            servicioSeleccionado = { id, nombre, precio };
            document.getElementById('label-total-cobrar').innerText = `$${Number(precio).toFixed(2)}`;
            mostrarToast(`Seleccionado: ${nombre}`);
        }

        function abrirModalServicios() {
            const modal = document.getElementById('modal-servicios');
            if (modal) {
                modal.classList.remove('hidden');
                renderizarServiciosEditableModal();
            }
        }

        function cerrarModalServicios() {
            const modal = document.getElementById('modal-servicios');
            if (modal) {
                modal.classList.add('hidden');
                cargarServiciosEstudio();
            }
        }

        function renderizarServiciosEditableModal() {
            const container = document.getElementById('container-servicios-editar');
            if (!container) return;
            container.innerHTML = '';

            if (serviciosEstudio.length === 0) {
                container.innerHTML = `<p class="text-xs text-stone-500 text-center py-2">Sin servicios registrados.</p>`;
                return;
            }

            serviciosEstudio.forEach(s => {
                container.innerHTML += `
                    <div class="flex items-center gap-2 bg-stone-950 p-2 rounded-xl border border-stone-800">
                        <input type="text" id="edit-nombre-${s.id}" value="${s.nombre_servicio}" class="flex-1 bg-stone-900 border border-stone-800 p-1.5 rounded-lg text-xs text-stone-100">
                        <input type="number" step="0.01" id="edit-precio-${s.id}" value="${s.precio}" class="w-20 bg-stone-900 border border-stone-800 p-1.5 rounded-lg text-xs font-mono text-stone-100">
                        <button onclick="guardarEdicionServicio('${s.id}')" class="bg-emerald-600 hover:bg-emerald-500 text-stone-950 px-2.5 py-1.5 rounded-lg text-xs font-bold transition" title="Guardar">💾</button>
                        <button onclick="eliminarServicio('${s.id}')" class="bg-rose-600 hover:bg-rose-500 text-stone-950 px-2.5 py-1.5 rounded-lg text-xs font-bold transition" title="Eliminar">🗑️</button>
                    </div>
                `;
            });
        }

        async function guardarEdicionServicio(id) {
            const nuevoNombre = document.getElementById(`edit-nombre-${id}`).value.trim();
            const nuevoPrecio = document.getElementById(`edit-precio-${id}`).value;

            if (!nuevoNombre || !nuevoPrecio) {
                mostrarToast("Completa ambos campos", true);
                return;
            }

            const { error } = await supabaseClient.from('servicios').update({
                nombre_servicio: nuevoNombre,
                precio: parseFloat(nuevoPrecio)
            }).eq('id', id);

            if (error) {
                mostrarToast("Error al actualizar: " + error.message, true);
            } else {
                mostrarToast("✓ Servicio actualizado");
                await cargarServiciosEstudio();
                renderizarServiciosEditableModal();
            }
        }

        async function eliminarServicio(id) {
            if (!confirm("¿Estás seguro de eliminar este servicio?")) return;

            const { error } = await supabaseClient.from('servicios').delete().eq('id', id);
            if (error) {
                mostrarToast("Error al eliminar: " + error.message, true);
            } else {
                mostrarToast("✓ Servicio eliminado");
                await cargarServiciosEstudio();
                renderizarServiciosEditableModal();
            }
        }

        async function crearNuevoServicio() {
            const nombre = document.getElementById('nuevo-nombre-servicio').value.trim();
            const precio = document.getElementById('nuevo-precio-servicio').value;

            if (!nombre || !precio || !usuarioActual) {
                mostrarToast("Ingresa nombre y precio válidos", true);
                return;
            }

            const { error } = await supabaseClient.from('servicios').insert([{
                usuario_id: usuarioActual.id,
                nombre_servicio: nombre,
                precio: parseFloat(precio)
            }]);

            if (error) {
                mostrarToast("Error al crear servicio: " + error.message, true);
            } else {
                document.getElementById('nuevo-nombre-servicio').value = '';
                document.getElementById('nuevo-precio-servicio').value = '';
                mostrarToast("✓ Servicio añadido con éxito");
                await cargarServiciosEstudio();
                renderizarServiciosEditableModal();
            }
        }

        async function guardarCitaCobro() {
            const clienta = document.getElementById('input-buscar-clienta').value.trim();
            if (!clienta) {
                mostrarToast("Escribe el nombre de la clienta", true);
                return;
            }
            if (!servicioSeleccionado) {
                mostrarToast("Selecciona un servicio", true);
                return;
            }

            mostrarToast(`✓ Cobro registrado para ${clienta}`);
            document.getElementById('input-buscar-clienta').value = '';
            document.getElementById('input-nota-cobro').value = '';
            document.getElementById('label-total-cobrar').innerText = '$0.00';
            servicioSeleccionado = null;
        }

        function cerrarSesion() {
            sessionStorage.removeItem('bellapp_user');
            usuarioActual = null;
            document.getElementById('app-principal').classList.add('hidden');
            document.getElementById('pantalla-login').classList.remove('hidden');
            mostrarToast("Sesión cerrada");
        }

        document.addEventListener('DOMContentLoaded', () => {
            const guardado = sessionStorage.getItem('bellapp_user');
            if (guardado) {
                usuarioActual = JSON.parse(guardado);
                aplicarConfiguracionEstudio(usuarioActual);
            }
        });
    </script>
</body>
</html>
