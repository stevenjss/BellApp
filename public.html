<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva de Cita - BellApp</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #FBF9F5; }
        .font-serif-luxury { font-family: 'Playfair Display', serif; }
    </style>
</head>
<body class="text-stone-800 min-h-screen p-4 flex flex-col items-center justify-center">

    <!-- TOAST -->
    <div id="toast" class="fixed top-4 left-1/2 -translate-x-1/2 z-50 hidden bg-[#5C4231] text-white text-xs px-5 py-3 rounded-xl shadow-lg border border-[#8C6D58] max-w-xs text-center">
        <span id="toast-msg">Mensaje</span>
    </div>

    <div class="max-w-md w-full bg-white rounded-3xl p-6 shadow-xl border border-[#EFE7DE] space-y-5">
        
        <div class="text-center space-y-2">
            <div id="estudio-logo" class="w-16 h-16 rounded-2xl mx-auto border border-[#D8C8BC] flex items-center justify-center bg-[#FBF9F5] overflow-hidden shadow-xs">
                <span class="font-serif-luxury text-2xl font-bold text-[#7C5C43]">B✨</span>
            </div>
            <h1 id="estudio-nombre" class="font-serif-luxury text-xl font-bold text-[#5C4231]">Cargando Estudio...</h1>
            <p class="text-xs text-stone-500 uppercase tracking-wider">Reserva tu cita en línea</p>
        </div>

        <div id="formulario-reserva" class="space-y-4 hidden">
            <div>
                <label class="block text-xs font-semibold text-stone-600 mb-1">Tu Nombre Completo:</label>
                <input type="text" id="cliente-nombre" placeholder="Ej. María Pérez" class="w-full border border-[#D8C8BC] p-3 rounded-xl text-xs bg-[#FBF9F5] focus:outline-none focus:border-[#8C6D58]">
            </div>

            <div>
                <label class="block text-xs font-semibold text-stone-600 mb-1">Tu Teléfono / WhatsApp:</label>
                <input type="tel" id="cliente-telefono" placeholder="Ej. 0991234567" class="w-full border border-[#D8C8BC] p-3 rounded-xl text-xs bg-[#FBF9F5] focus:outline-none focus:border-[#8C6D58]">
            </div>

            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="block text-xs font-semibold text-stone-600 mb-1">Fecha:</label>
                    <input type="date" id="cita-fecha" class="w-full border border-[#D8C8BC] p-2.5 rounded-xl text-xs bg-[#FBF9F5]">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-stone-600 mb-1">Hora (Intervalos de 30 min):</label>
                    <input type="time" id="cita-hora" step="1800" class="w-full border border-[#D8C8BC] p-2.5 rounded-xl text-xs bg-[#FBF9F5]">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-stone-600 mb-2 uppercase tracking-wider">Selecciona el Servicio:</label>
                <div id="lista-servicios-publicos" class="space-y-2 max-h-48 overflow-y-auto pr-1">
                    <!-- Servicios cargados dinámicamente -->
                </div>
            </div>

            <div class="bg-[#F9F5F0] p-3 rounded-xl flex justify-between items-center border border-[#E8DDD1]">
                <span class="text-xs font-semibold text-[#7C5C43] uppercase">TOTAL ESTIMADO:</span>
                <span id="publico-total" class="text-lg font-bold text-[#5C4231] font-serif-luxury">$0.00</span>
            </div>

            <button onclick="enviarReservaPublica()" id="btn-reservar" class="w-full py-3.5 rounded-xl font-bold text-white text-xs shadow-md transition">Confirmar y Agendar Cita</button>
        </div>

        <div id="mensaje-error-estudio" class="hidden text-center py-6 text-stone-500 text-xs">
            ⚠️ El estudio solicitado no existe o el enlace es incorrecto.
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://udddoohrdhmekrwstcnu.supabase.co"; 
        const SUPABASE_ANON_KEY = "sb_publishable_qr02Rl-cs9BWfws_pN3fSQ_5MZ5q6F-"; 
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let usuarioActualId = null;
        let serviciosSeleccionadosPublico = [];
        let colorPrimarioEstudio = '#7C5C43';

        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const slugEstudio = urlParams.get('estudio');

            if (!slugEstudio) {
                mostrarErrorEstudio();
                return;
            }

            document.getElementById('cita-fecha').value = new Date().toISOString().split('T')[0];
            await cargarDatosEstudioPorSlug(slugEstudio);
        });

        function mostrarToast(msg) {
            const t = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            t.classList.remove('hidden');
            setTimeout(() => t.classList.add('hidden'), 3500);
        }

        function mostrarErrorEstudio() {
            document.getElementById('estudio-nombre').innerText = "Enlace no válido";
            document.getElementById('mensaje-error-estudio').classList.remove('hidden');
        }

        async function cargarDatosEstudioPorSlug(slug) {
            let { data: usuario } = await supabaseClient
                .from('usuarios')
                .select('*')
                .eq('slug', slug)
                .single();

            if (!usuario) {
                let { data: usuarioAlt } = await supabaseClient
                    .from('usuarios')
                    .select('*')
                    .eq('usuario', slug)
                    .single();
                usuario = usuarioAlt;
            }

            if (!usuario || usuario.estado === 'suspendido') {
                mostrarErrorEstudio();
                return;
            }

            usuarioActualId = usuario.id;
            document.getElementById('estudio-nombre').innerText = usuario.nombre_estudio;

            if (usuario.logo_url) {
                document.getElementById('estudio-logo').innerHTML = `<img src="${usuario.logo_url}" class="w-full h-full object-cover">`;
            }

            const { data: config } = await supabaseClient
                .from('configuracion_estudio')
                .select('color_primario')
                .eq('usuario_id', usuario.id)
                .single();

            if (config && config.color_primario) {
                colorPrimarioEstudio = config.color_primario;
                document.getElementById('btn-reservar').style.backgroundColor = colorPrimarioEstudio;
            } else {
                document.getElementById('btn-reservar').style.backgroundColor = '#7C5C43';
            }

            await cargarServiciosPublicos(usuario.id);
            document.getElementById('formulario-reserva').classList.remove('hidden');
        }

        async function cargarServiciosPublicos(usuarioId) {
            const { data: servicios } = await supabaseClient
                .from('servicios')
                .select('*')
                .eq('usuario_id', usuarioId);

            const contenedor = document.getElementById('lista-servicios-publicos');
            contenedor.innerHTML = '';

            if (!servicios || servicios.length === 0) {
                contenedor.innerHTML = `<p class="text-xs text-stone-400 text-center py-2">No hay servicios disponibles por el momento.</p>`;
                return;
            }

            servicios.forEach(s => {
                contenedor.innerHTML += `
                    <div onclick="toggleServicioPublico('${s.nombre_servicio}', ${s.precio}, this)" class="p-3 border border-[#E8DDD1] rounded-xl bg-[#FBF9F5] hover:bg-[#F2EAE1] cursor-pointer transition flex justify-between items-center text-xs">
                        <span class="font-medium text-stone-700">${s.nombre_servicio}</span>
                        <span class="font-bold" style="color: ${colorPrimarioEstudio}">$${Number(s.precio).toFixed(2)}</span>
                    </div>
                `;
            });
        }

        function toggleServicioPublico(nombre, precio, elemento) {
            const index = serviciosSeleccionadosPublico.findIndex(s => s.nombre === nombre);
            if (index > -1) {
                serviciosSeleccionadosPublico.splice(index, 1);
                elemento.style.backgroundColor = '#FBF9F5';
                elemento.style.borderColor = '#E8DDD1';
            } else {
                serviciosSeleccionadosPublico.push({ nombre, precio });
                elemento.style.backgroundColor = '#F4EFE6';
                elemento.style.borderColor = colorPrimarioEstudio;
            }
            actualizarTotalPublico();
        }

        function actualizarTotalPublico() {
            let total = 0;
            serviciosSeleccionadosPublico.forEach(s => total += s.precio);
            document.getElementById('publico-total').innerText = `$${total.toFixed(2)}`;
        }

        async function enviarReservaPublica() {
            const nombre = document.getElementById('cliente-nombre').value.trim();
            const telefono = document.getElementById('cliente-telefono').value.trim();
            const fecha = document.getElementById('cita-fecha').value;
            const hora = document.getElementById('cita-hora').value;

            if (!nombre || !fecha || !hora || serviciosSeleccionadosPublico.length === 0) {
                mostrarToast("Por favor completa tu nombre, fecha, hora y selecciona al menos un servicio.");
                return;
            }

            // Validar restricción de 1 hora de espacio respecto a otras citas del mismo día
            const { data: citasExistentes } = await supabaseClient
                .from('citas')
                .select('hora, estado')
                .eq('usuario_id', usuarioActualId)
                .eq('fecha', fecha)
                .neq('estado', 'eliminada');

            if (citasExistentes && citasExistentes.length > 0) {
                const [nuevoH, nuevoM] = hora.split(':').map(Number);
                const minutosNuevaCita = nuevoH * 60 + nuevoM;

                for (let cita of citasExistentes) {
                    if (!cita.hora) continue;
                    // Ignorar citas canceladas o retenidas si deseas, pero validamos pendientes y atendidas
                    if (cita.estado === 'retenido') continue; 

                    const [hExistente, mExistente] = cita.hora.split(':').map(Number);
                    const minutosCitaExistente = hExistente * 60 + mExistente;

                    const diferenciaMinutos = Math.abs(minutosNuevaCita - minutosCitaExistente);

                    // Si hay menos de 60 minutos (1 hora) de diferencia, se bloquea
                    if (diferenciaMinutos < 60) {
                        mostrarToast(`⚠️ Ya hay una cita cercana a las ${cita.hora}. Debe existir al menos 1 hora de espacio entre citas.`);
                        return;
                    }
                }
            }

            // 1. Verificar o crear clienta en la tabla 'clientes' de ese estudio
            let { data: clienteExistente } = await supabaseClient
                .from('clientes')
                .select('id')
                .eq('usuario_id', usuarioActualId)
                .ilike('nombre', nombre)
                .single();

            let clienteId = clienteExistente ? clienteExistente.id : null;

            if (!clienteId) {
                const { data: nuevoCliente, error: errCliente } = await supabaseClient
                    .from('clientes')
                    .insert([{ usuario_id: usuarioActualId, nombre, telefono }])
                    .select('id')
                    .single();

                if (errCliente) {
                    mostrarToast("Error al registrar cliente");
                    return;
                }
                clienteId = nuevoCliente.id;
            }

            let sumaTotal = 0;
            serviciosSeleccionadosPublico.forEach(s => sumaTotal += s.precio);
            const nombresServicios = serviciosSeleccionadosPublico.map(s => s.nombre).join(', ');

            // 2. Insertar la cita en la tabla 'citas' con estado pendiente
            const { error: errCita } = await supabaseClient.from('citas').insert([{
                usuario_id: usuarioActualId,
                cliente_id: clienteId,
                fecha,
                hora,
                servicios: nombresServicios,
                total: sumaTotal,
                anticipo: 0.00,
                metodo_pago: 'pendiente',
                estado: 'pendiente'
            }]);

            if (errCita) {
                mostrarToast("Error al registrar la cita. Inténtalo nuevamente.");
                console.error(errCita);
                return;
            }

            document.getElementById('formulario-reserva').innerHTML = `
                <div class="text-center py-8 space-y-3">
                    <div class="w-12 h-12 bg-emerald-100 text-emerald-800 rounded-full flex items-center justify-center mx-auto font-bold text-lg">✓</div>
                    <h2 class="font-serif-luxury text-lg font-bold text-stone-800">¡Cita Solicitada con Éxito!</h2>
                    <p class="text-xs text-stone-500">Tu cita ha sido agendada correctamente. Te esperamos.</p>
                </div>
            `;
        }
    </script>
</body>
</html>
